name: PostShip cron tick

on:
  schedule:
    # Backup only — GitHub's scheduled workflows are not reliable at tight
    # intervals on a low-activity repo (observed 3-5h gaps in practice, not
    # minutes). The primary 5-min trigger is an external cron service (see
    # docs/ARCHITECTURE.md — Runner); this hourly run is a safety net in
    # case that service is down, not the main driver.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        run: |
          curl -fsS -X GET "${{ secrets.APP_URL }}/api/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
