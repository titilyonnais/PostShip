name: PostShip weekly digest

on:
  schedule:
    # Backup only, same reasoning as cron.yml — the primary trigger is
    # meant to be a weekly call from the external cron service. GitHub's
    # scheduled workflows aren't reliable at exact times, so this is a
    # safety net, not the main driver. FIXME_FOUNDER: add a weekly
    # Monday-morning call to /api/cron/digest on the external cron
    # service, same secret as the main tick.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/digest
        run: |
          curl -fsS -X GET "${{ secrets.APP_URL }}/api/cron/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
